<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>절하는 포스터 · Pose Interaction</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#10131b;
    color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  #app { position:fixed; inset:0; background:#10131b; }
  #camera { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #poseCanvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); pointer-events:none; }
  .shade { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.52),transparent 28%,transparent 68%,rgba(0,0,0,.58)); }
  header { position:absolute; z-index:2; top: max(18px, env(safe-area-inset-top)); left:18px; right:18px; text-align:center; }
  h1 { margin:0; font-size:clamp(23px,6vw,32px); letter-spacing:-1.2px; }
  header p { margin:7px 0 0; color:#d5d8e2; font-size:13px; }
  #status { position:absolute; z-index:3; top:112px; left:50%; transform:translateX(-50%);
    padding:10px 17px; border:1px solid rgba(255,255,255,.22); border-radius:999px;
    background:rgba(15,18,28,.72); font-size:14px; white-space:nowrap; backdrop-filter:blur(8px); }
  #counter { position:absolute; z-index:3; top: max(18px, env(safe-area-inset-top)); right:18px;
    padding:8px 12px; border-radius:12px; background:rgba(0,0,0,.42); font-size:13px; }
  #counter strong { color:#ffe16a; font-size:18px; margin-left:5px; }
  #guide { position:absolute; z-index:2; left:50%; bottom:calc(35px + env(safe-area-inset-bottom));
    transform:translateX(-50%); width:min(88%,390px); padding:13px 16px; border-radius:15px;
    text-align:center; font-size:13px; line-height:1.55; color:#f1f2f6;
    background:rgba(15,18,28,.68); backdrop-filter:blur(8px); }
  #start { position:absolute; z-index:10; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:15px; padding:28px; text-align:center; background:#111827; }
  #start .symbol { font-size:62px; }
  #start h2 { margin:0; font-size:26px; }
  #start p { max-width:330px; margin:0; color:#c4c9d5; line-height:1.65; font-size:14px; }
  button { margin-top:8px; border:0; border-radius:999px; padding:15px 35px; color:#171717;
    background:#ffe16a; font-size:17px; font-weight:800; cursor:pointer; }
  #character { position:absolute; z-index:5; left:50%; top:50%; transform:translate(-50%,-45%) scale(.4);
    opacity:0; pointer-events:none; text-align:center; transition:opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1); }
  #character.show { opacity:1; transform:translate(-50%,-45%) scale(1); }
  #threeStage { width:clamp(230px,66vw,360px); height:clamp(260px,58vh,430px); margin:auto; }
  #threeStage canvas { display:block; width:100%; height:100%; }
  #character small { display:inline-block; margin-top:12px; padding:8px 15px; border-radius:999px;
    background:#fff; color:#29231a; font-size:15px; font-weight:800; }

  #soundPanel { position:absolute; z-index:8; left:50%; top:158px; transform:translateX(-50%);
    width:min(88%,360px); padding:9px 12px; border-radius:13px; background:rgba(15,18,28,.78);
    backdrop-filter:blur(8px); text-align:center; font-size:12px; color:#f1f2f6; }
  #soundPanel label { display:block; margin-bottom:6px; font-weight:700; }
  #soundFile { display:block; width:100%; color:#fff; font-size:11px; }
  #soundName { display:block; margin-top:5px; color:#ffe16a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #error { position:absolute; z-index:11; left:18px; right:18px; bottom:18px; color:#ffd4d4;
    font-size:12px; text-align:center; line-height:1.5; }
  #debug { display:none; position:absolute; z-index:4; left:10px; bottom:120px; padding:7px 9px;
    border-radius:8px; background:rgba(0,0,0,.6); color:#fff; font:11px/1.5 monospace; white-space:pre; }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="poseCanvas"></canvas>
  <div class="shade"></div>
  <header>
    <h1>마주 보고, 인사해요</h1>
    <p>카메라 앞에서 고개 또는 상체를 숙여 보세요</p>
  </header>
  <div id="counter">절 완료 <strong id="count">0</strong></div>
  <div id="status">시작 버튼을 눌러 주세요</div>
  <div id="soundPanel">
    <label for="soundFile">절 완료 사운드 · 기본 SoundA.wav</label>
    <input id="soundFile" type="file" accept="audio/*">
    <span id="soundName">기본 사운드 SoundA.wav 재생 · 다른 파일로 변경 가능</span>
  </div>
  
  <div id="guide">화면에 상반신이 들어오도록 서 주세요.<br>꾸벅 인사도, 허리를 깊이 숙이는 큰절도 인식해요.</div>
  <div id="character">
    <div id="threeStage" aria-label="춤추는 3D 캐릭터"></div>
    <small id="greeting">반가워요!</small>
  </div>
  <div id="debug"></div>
  <div id="error"></div>
  <div id="start">
    <div class="symbol">🙇‍♀️</div>
    <h2>절하는 포스터</h2>
    <p>휴대폰을 세워 두고 카메라 앞에 서 주세요.<br>기본 SoundA.wav가 절 동작 완료 순간 재생됩니다. 원하면 다른 MP3/WAV로 바꿀 수 있어요.</p>
    <button id="startBtn">카메라 시작하기</button>
    <p style="font-size:11px;color:#8e96a8">카메라 권한이 필요합니다 · HTTPS 환경에서 실행해 주세요</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { FilesetResolver, PoseLandmarker } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const video = document.querySelector('#camera');
const canvas = document.querySelector('#poseCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.querySelector('#status');
const countEl = document.querySelector('#count');
const character = document.querySelector('#character');
const greeting = document.querySelector('#greeting');
const errorEl = document.querySelector('#error');
const debugEl = document.querySelector('#debug');
const soundFileEl = document.querySelector('#soundFile');
const soundNameEl = document.querySelector('#soundName');
let selectedAudioUrl = null;
let selectedAudioBuffer = null;
let activeAudioSource = null;

let landmarker = null;
let running = false;
let lastVideoTime = -1;
let count = 0;
let audioContext = null;
let characterTimer = null;
let threeScene, threeCamera, threeRenderer, dancer, mixer;
let danceAnalyser = null, danceData = null, danceTimer = null, danceUntil = 0;
let danceBeat = 0, nextBeatAt = 0;
const clock = new THREE.Clock();

function initThree() {
  if (threeRenderer) return;
  const stage = document.querySelector('#threeStage');
  threeScene = new THREE.Scene();
  threeCamera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  threeCamera.position.set(0, 1.25, 5.2);
  threeRenderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
  threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  threeRenderer.setSize(stage.clientWidth, stage.clientHeight);
  threeRenderer.outputColorSpace = THREE.SRGBColorSpace;
  threeRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  threeRenderer.toneMappingExposure = 1.15;
  stage.appendChild(threeRenderer.domElement);
  threeScene.add(new THREE.HemisphereLight(0xffffff, 0x536080, 2.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(2,4,5); threeScene.add(key);
  const rim = new THREE.DirectionalLight(0xffd36b, 1.5); rim.position.set(-3,2,-2); threeScene.add(rim);
  new GLTFLoader().load('./ModelA.glb', gltf => {
    dancer = gltf.scene;
    const box = new THREE.Box3().setFromObject(dancer);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    dancer.scale.setScalar(2.35 / maxDim);
    dancer.userData.baseScale = dancer.scale.x;
    dancer.position.set(-center.x * dancer.scale.x, -box.min.y * dancer.scale.y, -center.z * dancer.scale.z);
    threeScene.add(dancer);
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(dancer);
      gltf.animations.forEach(clip => mixer.clipAction(clip).play());
    }
  }, undefined, err => {
    console.error('ModelA.glb 로드 실패:', err);
    errorEl.textContent = 'ModelA.glb를 불러오지 못했어요. index.html과 같은 폴더에 ModelA.glb가 있는지 확인해 주세요.';
  });
  resizeThree();
  threeRenderer.setAnimationLoop(animateThree);
}
function resizeThree() {
  if (!threeRenderer) return;
  const stage = document.querySelector('#threeStage');
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  threeCamera.aspect = w / h; threeCamera.updateProjectionMatrix();
  threeRenderer.setSize(w, h, false);
}
function animateThree() {
  const dt = Math.min(clock.getDelta(), .05);
  if (mixer) mixer.update(dt);
  let pulse = 0;
  if (danceAnalyser && performance.now() < danceUntil) {
    danceAnalyser.getByteFrequencyData(danceData);
    let sum = 0; for (let i=2; i<Math.min(18,danceData.length); i++) sum += danceData[i];
    pulse = Math.min(1, (sum / 16) / 105);
  }
  if (dancer) {
    const t = performance.now() / 1000;
    const active = performance.now() < danceUntil;
    const bounce = active ? (0.045 + pulse * 0.13) * Math.abs(Math.sin(t * 7.4)) : 0;
    dancer.position.y = bounce;
    dancer.rotation.y = active ? Math.sin(t * 3.7) * (0.12 + pulse * 0.22) : Math.sin(t * .35) * .025;
    dancer.rotation.z = active ? Math.sin(t * 7.4) * (0.035 + pulse * .06) : 0;
    const s = active ? 1 + pulse * .055 : 1;
    dancer.scale.setScalar(dancer.userData.baseScale ? dancer.userData.baseScale * s : s);
  }
  if (threeRenderer && threeScene) threeRenderer.render(threeScene, threeCamera);
}
function drumHit(time, frequency=90, volume=.65) {
  const osc = audioContext.createOscillator(), gain = audioContext.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, time);
  osc.frequency.exponentialRampToValueAtTime(42, time + .14);
  gain.gain.setValueAtTime(volume, time); gain.gain.exponentialRampToValueAtTime(.001, time + .18);
  osc.connect(gain).connect(danceAnalyser); osc.start(time); osc.stop(time + .2);
}
function ensureDanceAnalyser() {
  if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') audioContext.resume();
  if (!danceAnalyser) {
    danceAnalyser = audioContext.createAnalyser(); danceAnalyser.fftSize = 256;
    danceData = new Uint8Array(danceAnalyser.frequencyBinCount);
    danceAnalyser.connect(audioContext.destination);
  }
}
function playDanceBeat() {
  ensureDanceAnalyser();
  clearInterval(danceTimer);
  const bpm = 112, beatMs = 60000 / bpm;
  danceUntil = performance.now() + 6500;
  nextBeatAt = audioContext.currentTime + .04; danceBeat = 0;
  danceTimer = setInterval(() => {
    if (!audioContext || performance.now() >= danceUntil) { clearInterval(danceTimer); danceTimer = null; return; }
    const now = audioContext.currentTime;
    while (nextBeatAt < now + .12) {
      const t = nextBeatAt;
      drumHit(t, danceBeat % 4 === 0 ? 105 : 78, danceBeat % 4 === 0 ? .8 : .48);
      const bass = audioContext.createOscillator(), g = audioContext.createGain();
      bass.type = 'triangle'; bass.frequency.setValueAtTime([110,146.8,130.8,164.8][danceBeat % 4], t);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.025); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      bass.connect(g).connect(danceAnalyser); bass.start(t); bass.stop(t+.24);
      nextBeatAt += beatMs / 1000; danceBeat++;
    }
  }, 70);
}
function stopActiveSound() {
  if (activeAudioSource) {
    try { activeAudioSource.stop(); } catch (_) {}
    activeAudioSource.disconnect();
    activeAudioSource = null;
  }
}
async function decodeAudioFile(file) {
  ensureDanceAnalyser();
  const bytes = await file.arrayBuffer();
  return await audioContext.decodeAudioData(bytes);
}
async function loadDefaultSound() {
  try {
    const response = await fetch('./SoundA.wav', { cache:'no-store' });
    if (!response.ok) throw new Error('SoundA.wav를 찾을 수 없습니다.');
    selectedAudioBuffer = await audioContext.decodeAudioData(await response.arrayBuffer());
    soundNameEl.textContent = '기본 사운드 준비 완료: SoundA.wav';
  } catch (err) {
    console.warn('기본 사운드 로드 실패:', err);
    selectedAudioBuffer = null;
    soundNameEl.textContent = 'SoundA.wav를 불러오지 못했어요. 사운드 파일을 직접 선택해 주세요.';
  }
}
function playSelectedSound() {
  ensureDanceAnalyser();
  stopActiveSound();
  clearInterval(danceTimer); danceTimer = null;
  clearTimeout(characterTimer);
  if (!selectedAudioBuffer) {
    playDanceBeat();
    characterTimer = setTimeout(() => character.classList.remove('show'), 6500);
    return;
  }
  try {
    const source = audioContext.createBufferSource();
    source.buffer = selectedAudioBuffer;
    source.connect(danceAnalyser);
    activeAudioSource = source;
    const durationMs = selectedAudioBuffer.duration * 1000;
    danceUntil = performance.now() + durationMs;
    source.onended = () => {
      if (activeAudioSource === source) activeAudioSource = null;
      danceUntil = 0;
      character.classList.remove('show');
    };
    source.start(0);
    characterTimer = setTimeout(() => character.classList.remove('show'), durationMs + 100);
  } catch (err) {
    console.error('사운드 재생 실패:', err);
    errorEl.textContent = '사운드 재생에 실패했어요. 기본 리듬으로 재생합니다.';
    playDanceBeat();
  }
}
soundFileEl.addEventListener('change', async () => {
  const file = soundFileEl.files && soundFileEl.files[0];
  if (!file) return;
  if (!file.type.startsWith('audio/')) {
    soundNameEl.textContent = '오디오 파일을 선택해 주세요.';
    soundFileEl.value = ''; return;
  }
  try {
    selectedAudioBuffer = await decodeAudioFile(file);
    soundNameEl.textContent = '사용자 사운드 준비 완료: ' + file.name;
  } catch (err) {
    console.error(err);
    soundNameEl.textContent = '파일을 읽지 못했어요. 다른 오디오 파일을 선택해 주세요.';
  }
});

// 동작 판정값: 학생 작업에 맞춰 이 숫자들을 조절할 수 있습니다.
const SETTINGS = {
  nodDown: 0.035,       // 코가 평소보다 아래로 이동한 비율
  shoulderDown: 0.018,  // 양 어깨 중심이 아래로 이동한 비율
  deepShoulder: 0.045,  // 이 이상이면 큰절로 분류
  deepAngle: 20,        // 상체 기울기(도)
  holdMs: 180,          // 숙인 자세를 유지해야 하는 최소 시간
  returnTolerance: 0.022,
  cooldownMs: 1100
};

let baseline = null;
let phase = 'waiting'; // waiting → upright → bowing → cooldown
let bowStartedAt = 0;
let lastCompletedAt = 0;
let currentMetrics = null;

function setStatus(message) { statusEl.textContent = message; }

function midpoint(a, b) {
  return { x:(a.x+b.x)/2, y:(a.y+b.y)/2, z:(a.z+b.z)/2 };
}
function getMetrics(lm) {
  const nose = lm[0], shoulders = midpoint(lm[11], lm[12]), hips = midpoint(lm[23], lm[24]);
  const torsoAngle = Math.atan2(Math.abs(shoulders.x-hips.x), Math.abs(hips.y-shoulders.y)) * 180 / Math.PI;
  return { noseY:nose.y, shoulderY:shoulders.y, torsoAngle,
    depth:shoulders.z-hips.z, torsoLength:Math.max(.08, Math.abs(hips.y-shoulders.y)) };
}
function visibleEnough(lm) {
  return [0,11,12,23,24].every(i => lm[i] && lm[i].visibility > 0.45);
}
function blendBaseline(m) {
  if (!baseline) { baseline = {...m}; return; }
  const k = .035;
  baseline.noseY += (m.noseY-baseline.noseY)*k;
  baseline.shoulderY += (m.shoulderY-baseline.shoulderY)*k;
  baseline.torsoAngle += (m.torsoAngle-baseline.torsoAngle)*k;
  baseline.depth += (m.depth-baseline.depth)*k;
}
function showCharacter(type) {
  greeting.textContent = type === '큰절' ? '정중한 인사 고마워요!' : '반가워요! 같이 춤춰요!';
  initThree();
  character.classList.add('show');
  clearTimeout(characterTimer);
  characterTimer = setTimeout(() => character.classList.remove('show'), 7000);
}

function playChime() { playSelectedSound(); }

function completeBow(type) {
  count++;
  countEl.textContent = count;
  showCharacter(type);
  playChime();
  setStatus(type + ' 완료! 고마워요 ✨');
  lastCompletedAt = performance.now();
  phase = 'cooldown';
}
function drawPose(lm) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const connections = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  ctx.lineWidth = Math.max(3, w*.006);
  ctx.strokeStyle = '#ffe16a';
  for (const [a,b] of connections) {
    if (lm[a].visibility < .45 || lm[b].visibility < .45) continue;
    ctx.beginPath(); ctx.moveTo(lm[a].x*w,lm[a].y*h); ctx.lineTo(lm[b].x*w,lm[b].y*h); ctx.stroke();
  }
  for (const i of [0,11,12,23,24]) {
    if (lm[i].visibility < .45) continue;
    ctx.beginPath(); ctx.arc(lm[i].x*w,lm[i].y*h,Math.max(4,w*.009),0,Math.PI*2);
    ctx.fillStyle = i === 0 ? '#ff8d76' : '#fff'; ctx.fill();
  }
}
function processPose(lm, now) {
  if (!visibleEnough(lm)) {
    if (phase === 'waiting' || phase === 'upright') setStatus('상반신이 보이도록 카메라 앞에 서 주세요');
    return;
  }
  const m = getMetrics(lm);
  currentMetrics = m;
  if (!baseline) {
    baseline = {...m};
    phase = 'upright';
    setStatus('좋아요! 고개나 상체를 숙여 보세요');
    return;
  }
  const noseDrop = m.noseY - baseline.noseY;
  const shoulderDrop = m.shoulderY - baseline.shoulderY;
  const angleChange = Math.abs(m.torsoAngle - baseline.torsoAngle);
  const depthChange = Math.abs(m.depth - baseline.depth);
  const nodDetected = noseDrop > SETTINGS.nodDown;
  const bodyDetected = shoulderDrop > SETTINGS.shoulderDown || angleChange > SETTINGS.deepAngle || depthChange > .075;
  const isDown = nodDetected || bodyDetected;

  if (phase === 'cooldown') {
    if (now - lastCompletedAt > SETTINGS.cooldownMs) {
      phase = 'upright';
      blendBaseline(m);
      setStatus('다시 인사할 수 있어요');
    }
    return;
  }
  if (phase === 'upright' || phase === 'waiting') {
    if (isDown) {
      phase = 'bowing';
      bowStartedAt = now;
      setStatus('인사 동작 인식 중… 다시 일어서 주세요');
    } else {
      blendBaseline(m);
      phase = 'upright';
      setStatus('고개나 상체를 숙여 보세요');
    }
    return;
  }
  if (phase === 'bowing') {
    const returned = Math.abs(noseDrop) < SETTINGS.returnTolerance &&
      Math.abs(shoulderDrop) < SETTINGS.returnTolerance &&
      angleChange < SETTINGS.deepAngle && depthChange < .075;
    if (returned && now - bowStartedAt >= SETTINGS.holdMs) {
      const isDeep = Math.abs(shoulderDrop) > SETTINGS.deepShoulder ||
        angleChange > SETTINGS.deepAngle || depthChange > .11;
      completeBow(isDeep ? '큰절' : '꾸벅 인사');
    } else if (now - bowStartedAt > 5000) {
      phase = 'upright';
      baseline = {...m};
      setStatus('다시 자세를 잡고 시도해 주세요');
    } else if (returned) {
      setStatus('조금만 더 숙였다가 일어서 보세요');
    }
  }
  debugEl.textContent = `nose Δ ${noseDrop.toFixed(3)}\nshoulder Δ ${shoulderDrop.toFixed(3)}\nangle ${angleChange.toFixed(1)}°\ndepth Δ ${depthChange.toFixed(3)}\nphase ${phase}`;
}
async function predict() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = landmarker.detectForVideo(video, performance.now());
    if (result.landmarks && result.landmarks.length) {
      const lm = result.landmarks[0];
      drawPose(lm);
      processPose(lm, performance.now());
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      setStatus('사람을 찾고 있어요…');
    }
  }
  requestAnimationFrame(predict);
}
async function start() {
  document.querySelector('#start').style.display = 'none';
  errorEl.textContent = '';
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();
    ensureDanceAnalyser();
    await loadDefaultSound();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false, video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    setStatus('자세 인식 모델을 준비하고 있어요…');
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    const modelOptions = {
      baseOptions: {
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'
      },
      runningMode:'VIDEO',
      numPoses:1,
      minPoseDetectionConfidence:.55,
      minPosePresenceConfidence:.55,
      minTrackingConfidence:.55
    };
    try {
      landmarker = await PoseLandmarker.createFromOptions(vision, { ...modelOptions, baseOptions:{ ...modelOptions.baseOptions, delegate:'GPU' } });
    } catch (gpuError) {
      console.warn('GPU 실행 실패, CPU로 전환합니다.', gpuError);
      landmarker = await PoseLandmarker.createFromOptions(vision, modelOptions);
    }
    running = true;
    setStatus('화면 중앙에 서 주세요');
    requestAnimationFrame(predict);
  } catch (err) {
    console.error(err);
    document.querySelector('#start').style.display = 'flex';
    errorEl.textContent = '카메라 또는 자세 인식 모델을 시작하지 못했어요. HTTPS 주소인지, 카메라 권한과 인터넷 연결이 허용됐는지 확인해 주세요. (' + (err.message || err) + ')';
  }
}
const startBtn = document.querySelector('#startBtn');
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = '카메라와 인식 모델을 준비하고 있어요…';
  try { await start(); }
  finally {
    if (!running) {
      startBtn.disabled = false;
      startBtn.textContent = '다시 시작하기';
    }
  }
});
window.addEventListener('resize', () => {
  if (video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
  resizeThree();
});
</script>
</body>
